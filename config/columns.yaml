# Column and layer names in the differential-expression results file.
# Fill these in after running: python scripts/01_inspect_perturb.py --path <file>
# Leave a field null if the file has no equivalent; required fields raise an error when null.
de_results:
  path: "{data_root}/raw/czi_tcell/GWCD4i.DE_stats.h5ad"   # sha256 c355f535ff32cf7b...

obs:
  target_gene: target_contrast_gene_name   # REQUIRED: perturbed gene symbol
  target_gene_id: target_contrast          # optional: perturbed gene Ensembl ID (preferred for mapping)
  condition: culture_condition             # REQUIRED: culture condition (labels must match probe.condition_text keys)
  n_cells: n_cells_target                  # optional: cells per perturbation
  effect_size: n_downstream                # optional: e.g. number of DE genes; reported per density bin
  ontarget_significant: ontarget_significant   # optional: on-target knockdown significant (10% FDR), per perturbation x condition; reported per bin, not filtered on
  # Flags listed on the dataset page; confirm the exact names and meanings before use.
  flags_exclude_true: [neighboring_gene_KD, distal_offtarget_flag, low_target_gex]
  flags_require_true: []   # keep_test_genes is not in the DE file; it holds only DE-eligible perturbations (D-009)

var:
  gene_symbol: gene_name                   # var column with readout gene symbols; null = use var index

layers:
  lfc: log_fc                              # log2 fold change (DESeq2); REQUIRED: log fold change ("X" if stored in X)
  padj: adj_p_value                        # FDR-adjusted (DESeq2); REQUIRED: adjusted p-value
  se: lfcSE                                # optional: standard error
